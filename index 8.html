<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="referrer" content="strict-origin-when-cross-origin"><title>HomeTheater</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"><style>:root { --bg: #050505; --panel-bg: rgba(24, 21, 17, 0.6); --panel-border: rgba(255, 214, 10, 0.14); --chalk: #f5f0e6; --chalk-dim: rgba(245, 240, 230, 0.62); --muted: #94897a; --accent: #ffd60a; --accent-hover: #ffe14d; --accent-ink: #1c1608; --danger: #ff453a; --danger-bg: rgba(255, 69, 58, 0.15); --velvet: #7a1522; --glass-btn-bg: rgba(255, 255, 255, 0.08); --glass-btn-border: rgba(255, 255, 255, 0.16); --glass-blur: blur(20px); --radius: 18px; --apple-font: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; --display-font: 'Bebas Neue', var(--apple-font); --mono: 'JetBrains Mono', ui-monospace, monospace; --bg-gradient: radial-gradient(ellipse 640px 320px at 18% -6%, rgba(255, 214, 10, 0.06), transparent 60%), radial-gradient(ellipse 520px 420px at 92% 8%, rgba(255, 255, 255, 0.03), transparent 60%), radial-gradient(ellipse 700px 400px at 50% 105%, rgba(122, 21, 34, 0.05), transparent 55%); } /* ライトモード用変数定義 */ body.light-mode { --bg: #f7f5f1; --panel-bg: rgba(255, 255, 255, 0.68); --panel-border: rgba(0, 0, 0, 0.1); --chalk: #1d1d1f; --chalk-dim: rgba(60, 60, 67, 0.7); --muted: #86868b; --accent: #0071e3; --accent-hover: #0077ed; --accent-ink: #ffffff; --glass-btn-bg: rgba(0, 0, 0, 0.05); --glass-btn-border: rgba(0, 0, 0, 0.15); --bg-gradient: radial-gradient(circle at 15% 50%, rgba(0, 113, 227, 0.04), transparent 25%), radial-gradient(circle at 85% 30%, rgba(0, 0, 0, 0.02), transparent 25%); } * { box-sizing: border-box; } html, body { margin: 0; padding: 0; } body { background-color: var(--bg); background-image: var(--bg-gradient); color: var(--chalk); font-family: var(--apple-font); line-height: 1.6; min-height: 100vh; padding: 40px 20px 80px; -webkit-font-smoothing: antialiased; transition: background-color 0.3s ease, color 0.3s ease, background-image 0.3s ease; position: relative; } /* 映画フィルム風の粒子とビネット（雰囲気づくり） */ body::before { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .035; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); } body.light-mode::before { opacity: .018; } body::after { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 40%, transparent 55%, rgba(0,0,0,.4) 100%); } body.light-mode::after { background: radial-gradient(ellipse at 50% 40%, transparent 60%, rgba(0,0,0,.05) 100%); } .wrap { max-width: 860px; margin: 0 auto; position: relative; z-index: 1; } @media (prefers-reduced-motion: no-preference) { .wrap >section { animation: panelIn .6s cubic-bezier(.16,.8,.3,1) both; } .wrap >section:nth-of-type(1) { animation-delay: .02s; } .wrap >section:nth-of-type(2) { animation-delay: .07s; } .wrap >section:nth-of-type(3) { animation-delay: .12s; } .wrap >section:nth-of-type(4) { animation-delay: .17s; } .wrap >section:nth-of-type(5) { animation-delay: .22s; } @keyframes panelIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } } } @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-play-state: paused !important; transition: none !important; } .spinner { animation-play-state: running !important; } } :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; } /* Header */ header { margin-bottom: 36px; text-align: center; position: relative; } .header-controls { position: absolute; top: 0; right: 0; } .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; color: var(--muted); border: 1px solid var(--panel-border); padding: 6px 14px; border-radius: 999px; margin-bottom: 16px; text-transform: uppercase; } h1 { font-family: var(--display-font); font-weight: 400; font-size: clamp(40px, 8vw, 64px); margin: 0 0 6px; letter-spacing: 0.03em; } body.light-mode h1 { letter-spacing: 0.01em; } header p.lead { color: var(--chalk-dim); margin: 0 auto; font-size: 15px; max-width: 56ch; } /* Panel (Frosted Glass) */ .panel { background: var(--panel-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: 1px solid var(--panel-border); border-radius: var(--radius); padding: 24px; margin-bottom: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); transition: background 0.3s ease, border 0.3s ease; } body:not(.light-mode) .panel { box-shadow: 0 10px 30px rgba(0,0,0,0.5); } .panel h2 { font-size: 17px; font-weight: 600; margin: 0 0 18px; display: flex; align-items: center; gap: 10px; color: var(--chalk); flex-wrap: wrap; } .panel h2 .num { font-family: var(--mono); font-size: 12px; color: var(--accent-ink); background: var(--accent); border-radius: 8px; padding: 3px 8px; font-weight: bold; transition: background 0.3s ease, color 0.3s ease; } .count-badge { font-size: 12px; color: var(--muted); font-weight: 500; } /* Form Elements */ .search-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; } input[type=text], select { font-family: var(--apple-font); font-size: 15px; color: var(--chalk); background: rgba(0,0,0,0.2); border: 1px solid var(--glass-btn-border); border-radius: 12px; padding: 14px 16px; outline: none; transition: all 0.2s ease; } body:not(.light-mode) input[type=text], body:not(.light-mode) select { background: rgba(0,0,0,0.4); } input[type=text]:focus, select:focus { border-color: var(--accent); background: rgba(0,0,0,0.3); } body:not(.light-mode) input[type=text]:focus, body:not(.light-mode) select:focus { background: rgba(0,0,0,0.6); } #urlInput { flex: 1 1 320px; min-width: 0; } /* Buttons (Frosted Glass & Accent) */ button { font-family: var(--apple-font); font-weight: 600; font-size: 15px; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; border: 1px solid var(--glass-btn-border); background: var(--glass-btn-bg); color: var(--chalk); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 14px 20px; } button:active { transform: scale(0.98); } button:hover { background: rgba(255, 255, 255, 0.15); } body.light-mode button:hover { background: rgba(0, 0, 0, 0.08); } .btn-primary { background: var(--accent); color: var(--accent-ink); border: none; box-shadow: 0 4px 12px rgba(255, 214, 10, 0.2); } body.light-mode .btn-primary { box-shadow: 0 4px 12px rgba(0, 113, 227, 0.2); } .btn-primary:hover { background: var(--accent-hover); } .btn-ghost { background: transparent; border-color: var(--accent); color: var(--accent); } .btn-ghost:hover { background: rgba(255, 214, 10, 0.1); } body.light-mode .btn-ghost:hover { background: rgba(0, 113, 227, 0.1); } .btn-danger { background: transparent; color: var(--danger); border-color: var(--danger-bg); } .btn-danger:hover { background: var(--danger-bg); border-color: var(--danger); } .btn-small { padding: 8px 14px; font-size: 13px; border-radius: 8px; } .field { display: flex; flex-direction: column; gap: 8px; } .field label { font-size: 13px; color: var(--muted); font-weight: 500; } select { padding: 12px 16px; min-width: 140px; cursor: pointer; } /* Player Stage */ .stage { position: relative; padding: 0; background: #000; border-radius: 14px; box-shadow: 0 20px 50px -10px rgba(0,0,0,0.8); overflow: hidden; border: 1px solid var(--panel-border); } .video-box { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; } .video-box iframe, .video-box img { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; } /* マーキーライト（劇場の電飾看板演出） */ .marquee-lights { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; gap: 3px; background: #000; } .marquee-lights .bulb { width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 214, 10, .2); flex: 0 0 auto; } .stage.is-loading .marquee-lights .bulb { animation: bulbChase 1s ease-in-out infinite; animation-delay: calc(var(--i) * 0.045s); } .stage.is-live .marquee-lights .bulb { animation: bulbTwinkle 2.6s ease-in-out infinite; animation-delay: calc(var(--i) * 0.09s); } @keyframes bulbChase { 0%, 100% { background: rgba(255, 214, 10, .2); } 50% { background: var(--accent); box-shadow: 0 0 6px 2px rgba(255, 214, 10, .7); } } @keyframes bulbTwinkle { 0%, 100% { background: rgba(255, 214, 10, .32); } 50% { background: var(--accent); box-shadow: 0 0 5px 1px rgba(255, 214, 10, .5); } } /* 「本日の上映」ティッカー */ .marquee-ticker { display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: #000; border-top: 1px solid rgba(255,214,10,.12); border-bottom: 1px solid rgba(255,214,10,.12); } .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); flex: 0 0 auto; opacity: 0; box-shadow: 0 0 6px 2px rgba(255,69,58,.6); } .marquee-ticker.live .live-dot { opacity: 1; animation: livePulse 1.6s ease-in-out infinite; } @keyframes livePulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } } .ticker-scroll { flex: 1; overflow: hidden; white-space: nowrap; min-width: 0; } .ticker-scroll span { display: inline-block; font-family: var(--mono); font-size: 12px; letter-spacing: .03em; color: var(--accent); padding-left: 30%; animation: tickerScroll 16s linear infinite; } @keyframes tickerScroll { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } } #stageEl:fullscreen { display: flex; align-items: center; justify-content: center; } #stageEl:fullscreen .marquee-lights, #stageEl:fullscreen .marquee-ticker { display: none; } #stageEl:fullscreen .video-box { width: 100%; height: 100%; aspect-ratio: auto; } /* 黒板シアター風のステータスオーバーレイ */ .player-status-overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px; color: #ffffff; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 10; font-size: 14px; text-align: center; } .player-status-overlay.active { opacity: 1; pointer-events: auto; } .spinner { width: 36px; height: 36px; border: 4px solid rgba(255, 255, 255, 0.1); border-left-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; } @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } } .placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--muted); font-size: 14px; text-align: center; padding: 20px; } .placeholder .big { font-size: 40px; margin-bottom: 10px; } .meta-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-top: 20px; flex-wrap: wrap; } .meta-left { flex: 1; min-width: 0; } .meta-actions { display: flex; gap: 8px; flex-wrap: wrap; } #titleDisplay { font-size: 18px; font-weight: 700; color: var(--chalk); letter-spacing: 0.02em; } #titleDisplay.muted { color: var(--muted); font-weight: 500; font-size: 15px; } #idDisplay { font-family: var(--mono); font-size: 13px; color: var(--muted); margin-top: 6px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; } /* History & Favorites Tiles */ .list-empty-msg { color: var(--muted); font-size: 14px; } .list-toolbar { margin-bottom: 14px; } .list-toolbar input[type=text] { width: 100%; } .section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; } .head-actions { display: flex; gap: 8px; flex-wrap: wrap; } .history-scroll { display: flex; gap: 16px; overflow-x: auto; padding: 10px 4px 20px; scrollbar-width: thin; } .hcard { flex: 0 0 180px; background: var(--glass-btn-bg); border: 1px solid var(--glass-btn-border); border-radius: 14px; padding: 10px; position: relative; cursor: pointer; transition: all 0.2s ease; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); } .hcard:hover { border-color: var(--accent); background: rgba(255, 255, 255, 0.15); transform: translateY(-3px); } body.light-mode .hcard:hover { background: rgba(0, 0, 0, 0.04); } .hcard img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; margin-bottom: 10px; background: #000; } .hcard .htitle { font-weight: 500; font-size: 13px; color: var(--chalk); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; } .hcard .hcard-time { font-size: 11px; color: var(--muted); margin-top: 4px; } .hcard .hdel { position: absolute; top: -6px; right: -6px; width: 24px; height: 24px; border-radius: 50%; background: rgba(0,0,0,0.6); color: #fff; border: 1px solid var(--panel-border); font-size: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s ease; } .hcard .hdel:hover { background: var(--danger); border-color: var(--danger); color: #fff; } /* シマーローディング */ .shimmer { background: linear-gradient(100deg, rgba(255,255,255,.05) 25%, rgba(255,255,255,.15) 50%, rgba(255,255,255,.05) 75%); background-size: 200% 100%; animation: shimmerMove 1.4s ease-in-out infinite; } body.light-mode .shimmer { background: linear-gradient(100deg, rgba(0,0,0,.04) 25%, rgba(0,0,0,.1) 50%, rgba(0,0,0,.04) 75%); background-size: 200% 100%; } @keyframes shimmerMove { 0% { background-position: -150% 0; } 100% { background-position: 150% 0; } } .skel-circle { width: 44px; height: 44px; border-radius: 50%; } .skel-line { height: 12px; border-radius: 6px; margin-bottom: 8px; } /* Comments */ #commentsEmpty { color: var(--muted); font-size: 14px; text-align: center; padding: 30px; } .comment-item { display: flex; gap: 14px; margin-bottom: 24px; } .comment-avatar img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 1px solid var(--panel-border); } .comment-content { flex: 1; overflow-wrap: anywhere; } .comment-header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 14px; } .author-name { font-weight: 600; color: var(--chalk); } .published-date { color: var(--muted); font-size: 12px; } .badge { font-size: 11px; padding: 2px 8px; border-radius: 6px; color: var(--accent-ink); font-weight: 600; background: var(--accent); } .comment-text { font-size: 15px; line-height: 1.6; color: var(--chalk-dim); margin-bottom: 10px; } .comment-text a { color: var(--accent); text-decoration: none; } .comment-text a:hover { text-decoration: underline; } .comment-footer { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--muted); } .creator-heart { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 12px; } body.light-mode .creator-heart { background: rgba(0,0,0,0.05); } .creator-heart img { width: 18px; height: 18px; border-radius: 50%; } /* トースト通知 */ .toast-container { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 10px; z-index: 1000; pointer-events: none; width: calc(100% - 40px); max-width: 420px; align-items: center; } .toast { pointer-events: auto; background: var(--panel-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: 1px solid var(--panel-border); color: var(--chalk); padding: 12px 18px; border-radius: 12px; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.4); max-width: 100%; text-align: center; animation: toastIn .25s ease; } .toast.error { border-color: rgba(255,69,58,.5); } .toast.success { border-color: rgba(255,214,10,.5); } .toast.leaving { animation: toastOut .25s ease forwards; } @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } } @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-6px); } } /* 確認モーダル */ .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 1100; opacity: 0; pointer-events: none; transition: opacity .2s ease; } .modal-overlay.active { opacity: 1; pointer-events: auto; } .modal-box { background: var(--panel-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: 1px solid var(--panel-border); border-radius: 16px; padding: 24px; max-width: 340px; width: 90%; box-shadow: 0 20px 50px rgba(0,0,0,.5); } .modal-box p { margin: 0 0 18px; font-size: 15px; color: var(--chalk); } .modal-actions { display: flex; gap: 10px; justify-content: flex-end; } @media(max-width: 500px) { .header-controls { position: static; margin-bottom: 16px; text-align: center; } }</style></head><body><div class="wrap"><header><div class="header-controls"><button type="button" id="themeToggleBtn" class="btn-ghost btn-small">🌙 Dark Mode</button></div><span class="eyebrow">🎟️ NOW SHOWING — HOME THEATER</span><h1>HomeTheater</h1><p class="lead">Appleスタイルの快適な視聴体験に、あなただけの特等席を。お好みのサーバーとオートフォールバックで、途切れない上映をお届けします。</p></header><section class="panel"><h2><span class="num">1</span>ビデオ設定</h2><div class="field" style="margin-bottom: 16px;"><label>再生ソース（youtubeeducation.com系サーバー）</label><select id="paramSource" style="width: 100%;"><option value="Auto">自動 (推奨 - 自動検知切り替え)</option><option value="Education - 1">Education - 1</option><option value="Education - 2">Education - 2</option><option value="Education - 3">Education - 3</option><option value="Education - 4">Education - 4</option></select></div><div class="search-row"><input type="text" id="urlInput" placeholder="YouTube URL または 動画IDを入力（/ キーでフォーカス）" autocomplete="off"><button type="button" id="pasteBtn" class="btn-ghost" title="クリップボードから貼り付け" aria-label="クリップボードから貼り付け">📋</button></div><div class="search-row"><button type="button" id="btnPlay" class="btn-primary" style="flex: 1;">▶ 再生する</button></div></section><section class="panel" id="theaterSection" style="display: none;"><h2><span class="num">2</span>シアター</h2><div class="stage" id="stageEl"><div class="marquee-lights" id="marqueeTop" aria-hidden="true"></div><div class="marquee-ticker" id="marqueeTickerWrap"><span class="live-dot" id="liveDot" aria-hidden="true"></span><div class="ticker-scroll"><span id="marqueeTickerText">🎬 本日の上映：入力をお待ちしています</span></div></div><div class="video-box" id="videoBox"><div class="player-status-overlay" id="playerStatusOverlay"><div class="spinner"></div><div id="statusOverlayText">サーバー接続中...</div></div><div class="placeholder" id="placeholder"><div class="big">🎬</div><div>URLを入力して再生ボタンを押してください</div></div></div><div class="marquee-lights" id="marqueeBottom" aria-hidden="true"></div></div><div class="meta-row"><div class="meta-left"><div id="titleDisplay" class="muted">タイトル：未取得</div><div id="idDisplay"></div></div><div class="meta-actions"><button type="button" id="fullscreenBtn" class="btn-ghost btn-small" title="フルスクリーン" aria-label="フルスクリーン">⛶</button><button type="button" id="copyLinkBtn" class="btn-ghost btn-small" title="リンクをコピー" aria-label="リンクをコピー">🔗</button><button type="button" id="favoriteToggleBtn" class="btn-ghost btn-small">⭐ お気に入りに追加</button></div></div></section><section class="panel" id="commentsSection" style="display: none;"><h2><span class="num">3</span>コメント<span id="commentCountBadge" style="font-size:15px; color:var(--accent);"></span></h2><div id="commentsContainer"><div id="commentsEmpty">動画を再生するとここにコメントが表示されます。</div></div></section><section class="panel"><div class="section-head"><h2 style="margin:0;"><span class="num">4</span>お気に入り<span class="count-badge" id="favCount"></span></h2><div class="head-actions"><button type="button" id="favSurpriseBtn" class="btn-ghost btn-small" title="おまかせ再生" aria-label="おまかせ再生">🎲</button><button type="button" id="favSortBtn" class="btn-ghost btn-small" data-mode="recent">🕒 最新順</button><button type="button" id="clearFavoritesBtn" class="btn-danger btn-small">すべて削除</button></div></div><div class="list-toolbar"><input type="text" id="favSearch" placeholder="お気に入りを検索..." autocomplete="off"></div><div id="favoritesEmpty" class="list-empty-msg">🍿 お気に入りに登録された動画はここに保存されます。</div><div class="history-scroll" id="favoritesScroll"></div></section><section class="panel"><div class="section-head"><h2 style="margin:0;"><span class="num">5</span>ライブラリ (履歴)<span class="count-badge" id="histCount"></span></h2><div class="head-actions"><button type="button" id="histSortBtn" class="btn-ghost btn-small" data-mode="recent">🕒 最新順</button><button type="button" id="clearHistoryBtn" class="btn-danger btn-small">すべて削除</button></div></div><div class="list-toolbar"><input type="text" id="historySearch" placeholder="履歴を検索..." autocomplete="off"></div><div id="historyEmpty" class="list-empty-msg">🎞️ 再生した動画はここにタイルとして保存されます。</div><div class="history-scroll" id="historyScroll"></div></section></div><div class="toast-container" id="toastContainer" aria-live="polite"></div><div class="modal-overlay" id="modalOverlay"><div class="modal-box"><p id="modalMessage"></p><div class="modal-actions"><button type="button" id="modalCancelBtn" class="btn-ghost btn-small">キャンセル</button><button type="button" id="modalConfirmBtn" class="btn-danger btn-small">削除する</button></div></div></div><script>// --- データ群 --- const URLS = { "Education - 1": "https://raw.githubusercontent.com/podetanato/key/refs/heads/main/key.json", "Education - 2": "https://raw.githubusercontent.com/podetanato/key/refs/heads/main/key2.json", "Education - 3": "https://raw.githubusercontent.com/podetanato/key/refs/heads/main/budkey.json", "Education - 4": "https://raw.githubusercontent.com/podetanato/key/refs/heads/main/lastkey.json" }; const autoServers = ["Education - 1", "Education - 2", "Education - 3", "Education - 4"]; let currentAutoIndex = 0; let fallbackTimer = null; // 黒板シアター風エラー自動検知用タイマー const fallbackApiUrls = [ "https://min-tube2-api.vercel.app", "https://min-tube-api-3.vercel.app", "https://server-minp.vercel.app" ]; let cachedApiUrls = null; let currentLoadedVideoId = null; let currentLoadedVideoTitle = "タイトル不明"; let favSortMode = "recent"; let histSortMode = "recent"; // --- ストレージ管理拡張 --- const store = { getHistory(){ try { return JSON.parse(localStorage.getItem('yte_history_ht') || '[]'); } catch(e){ return []; } }, saveHistory(arr){ localStorage.setItem('yte_history_ht', JSON.stringify(arr.slice(0,30))); }, getFavorites(){ try { return JSON.parse(localStorage.getItem('yte_favorites_ht') || '[]'); } catch(e){ return []; } }, saveFavorites(arr){ localStorage.setItem('yte_favorites_ht', JSON.stringify(arr)); }, getTheme(){ return localStorage.getItem('yte_theme_ht') || 'dark'; }, saveTheme(theme){ localStorage.setItem('yte_theme_ht', theme); } }; // --- 動画ID解析 --- function extractVideoId(input) { if (!input) return null; const patterns = [ /[?&]v=([\w-]{11})/, /(?:youtu\.be|embed|shorts|live|vi|videos|watch|w|s|v|video|stream|streams|m3u8|nocookie|edu|education|umekomi)\/([\w-]{11})/ ]; for (const p of patterns) { const m = input.match(p); if (m) return m[1]; } if (/^[\w-]{11}$/.test(input.trim())) return input.trim(); return null; } function updateUrlParam(url, key, value) { const regex = new RegExp(`([?&])(?:amp;)?${key}=[^&]*`, 'gi'); if (regex.test(url)) { return url.replace(regex, (match, separator) =>`${separator}${key}=${value}`); } const separator = url.includes('?') ? '&' : '?'; return `${url}${separator}${key}=${value}`; } // --- 演出まわりのヘルパー --- function generateBulbs(containerId, count) { const el = document.getElementById(containerId); if (!el) return; el.innerHTML = ''; for (let i = 0; i< count; i++) { const b = document.createElement('span'); b.className = 'bulb'; b.style.setProperty('--i', i); el.appendChild(b); } } function setStageState(state) { const stage = document.getElementById('stageEl'); stage.classList.remove('is-loading', 'is-live'); if (state === 'loading') stage.classList.add('is-loading'); if (state === 'live') stage.classList.add('is-live'); } function updateTicker(text, live) { const textEl = document.getElementById('marqueeTickerText'); const wrap = document.getElementById('marqueeTickerWrap'); textEl.textContent = '🎬 ' + text; wrap.classList.toggle('live', !!live); } function timeAgo(ts) { if (!ts) return ''; const diff = Date.now() - ts; const m = Math.floor(diff / 60000); if (m< 1) return 'たった今'; if (m< 60) return `${m}分前`; const h = Math.floor(m / 60); if (h< 24) return `${h}時間前`; const d = Math.floor(h / 24); if (d< 30) return `${d}日前`; return `${Math.floor(d / 30)}ヶ月前`; } // --- トースト通知 --- function toast(msg, type, duration) { type = type || 'info'; duration = duration || 3000; const container = document.getElementById('toastContainer'); const el = document.createElement('div'); el.className = `toast ${type}`; el.textContent = msg; container.appendChild(el); setTimeout(() =>{ el.classList.add('leaving'); setTimeout(() =>el.remove(), 250); }, duration); } // --- 確認モーダル --- function confirmDialog(message) { return new Promise(resolve =>{ const overlay = document.getElementById('modalOverlay'); document.getElementById('modalMessage').textContent = message; overlay.classList.add('active'); const cancelBtn = document.getElementById('modalCancelBtn'); const okBtn = document.getElementById('modalConfirmBtn'); function cleanup(result) { overlay.classList.remove('active'); cancelBtn.removeEventListener('click', onCancel); okBtn.removeEventListener('click', onOk); resolve(result); } function onCancel(){ cleanup(false); } function onOk(){ cleanup(true); } cancelBtn.addEventListener('click', onCancel); okBtn.addEventListener('click', onOk); }); } // --- 再生処理のメインロジック --- async function loadVideo(isAutoFallback = false) { if (fallbackTimer) clearTimeout(fallbackTimer); const input = document.getElementById("urlInput").value.trim(); const videoId = extractVideoId(input); if (!videoId) { toast("正しいURLまたは動画IDを入力してください。", 'error'); return; } const sourceSelect = document.getElementById("paramSource").value; let targetSource = sourceSelect; // 「自動」ロジックの判定 if (sourceSelect === "Auto") { if (!isAutoFallback) currentAutoIndex = 0; // 新規再生時はリセット if (currentAutoIndex >= autoServers.length) { showOverlayMessage("❌ すべてのサーバーで再生に失敗しました。"); setStageState('idle'); updateTicker('接続に失敗しました', false); toast('すべてのサーバーで再生に失敗しました。', 'error'); setTimeout(() =>hideOverlay(), 3000); currentAutoIndex = 0; return; } targetSource = autoServers[currentAutoIndex]; } document.getElementById("theaterSection").style.display = "block"; document.getElementById("commentsSection").style.display = "block"; // 黒板シアター風オーバーレイ表示の有効化 showOverlayMessage(`📡 ${targetSource} に接続中...`); setStageState('loading'); updateTicker(`${targetSource} に接続中...`, false); const container = document.getElementById("videoBox"); // iframe以外の既存の要素を残しつつ古いiframeだけ消すため、iframe要素を探して削除 const oldIframe = container.querySelector("iframe"); if (oldIframe) oldIframe.remove(); // UI更新 (ID表示とフォールバック用ボタン) const idDisplay = document.getElementById("idDisplay"); idDisplay.innerHTML = `<span>動画ID: ${videoId}</span><span style="color:var(--muted); font-size: 11px;">(Source: ${targetSource})</span>`; // Autoモード時：手動フォールバックボタンも配置維持 if (sourceSelect === "Auto" && currentAutoIndex< autoServers.length - 1) { const nextBtn = document.createElement("button"); nextBtn.className = "btn-ghost btn-small"; nextBtn.style.marginLeft = "10px"; nextBtn.innerText = `⚠️ 次のサーバーに切り替え`; nextBtn.onclick = () =>{ currentAutoIndex++; loadVideo(true); }; idDisplay.appendChild(nextBtn); } if (currentLoadedVideoId !== videoId || !isAutoFallback) { document.getElementById("titleDisplay").textContent = 'タイトルを取得中...'; document.getElementById("titleDisplay").classList.add('muted'); } const iframe = document.createElement("iframe"); iframe.allowFullscreen = true; iframe.allow = "autoplay; clipboard-write; encrypted-media; picture-in-picture"; iframe.referrerPolicy = "strict-origin-when-cross-origin"; let finalUrl = ""; try { // ネットワークレベルのブロック検知（Fetchによる事前チェック） const r = await fetch(URLS[targetSource], { cache: "no-store" }); if (!r.ok) throw new Error("Fetch failed"); let params = ""; const text = await r.text(); try { params = JSON.parse(text).result || JSON.parse(text).params || ""; } catch(e) { params = text; } finalUrl = `https://www.youtubeeducation.com/embed/${videoId}${params}`; } catch(e) { // ネットワークレベルで失敗した場合、自動で次のサーバーへ進む（黒板シアター風即時自動切り替え） if (sourceSelect === "Auto") { currentAutoIndex++; loadVideo(true); return; } finalUrl = `https://www.youtubeeducation.com/embed/${videoId}`; } finalUrl = updateUrlParam(finalUrl, 'cc_load_policy', '0'); finalUrl = updateUrlParam(finalUrl, 'iv_load_policy', '3'); finalUrl = updateUrlParam(finalUrl, 'hl', 'ja'); iframe.src = finalUrl; // 【黒板シアター風 エラー自動検知・タイムアウト監視システム】 // iframeの読み込みが開始されてから一定時間（5.5秒）以内にロード完了イベントが来ない、 // またはブロック等で応答がない場合、エラーとみなして自動的に次のサーバーにスイッチする。 if (sourceSelect === "Auto") { fallbackTimer = setTimeout(() =>{ console.warn(`${targetSource} の応答タイムアウトを検知しました。次のサーバーに自動フォールバックします。`); currentAutoIndex++; loadVideo(true); }, 5500); } iframe.onload = () =>{ // 正常にiframeがロードされたら切り替えタイマーをクリアしてオーバーレイを消す if (fallbackTimer) clearTimeout(fallbackTimer); hideOverlay(); setStageState('live'); }; container.appendChild(iframe); if (currentLoadedVideoId !== videoId || !isAutoFallback) { currentLoadedVideoId = videoId; fetchTitle(videoId); fetchComments(videoId); } } // --- 黒板シアター風オーバーレイ表示制御 --- function showOverlayMessage(msg) { const overlay = document.getElementById("playerStatusOverlay"); const textEl = document.getElementById("statusOverlayText"); textEl.textContent = msg; overlay.classList.add("active"); } function hideOverlay() { const overlay = document.getElementById("playerStatusOverlay"); overlay.classList.remove("active"); } // --- タイトル取得＆履歴 --- async function fetchTitle(id) { const watchUrl = 'https://www.youtube.com/watch?v=' + id; try { const res = await fetch('https://noembed.com/embed?url=' + encodeURIComponent(watchUrl)); const data = await res.json(); if (data && data.title) { document.getElementById("titleDisplay").textContent = data.title; document.getElementById("titleDisplay").classList.remove('muted'); currentLoadedVideoTitle = data.title; updateHistory(id, data.title); updateFavoriteButtonUI(); updateTicker(data.title, true); return; } } catch(e) {} document.getElementById("titleDisplay").textContent = "タイトル取得不可"; currentLoadedVideoTitle = "タイトル不明"; updateHistory(id, "タイトル不明"); updateFavoriteButtonUI(); updateTicker('タイトル不明', true); } function updateHistory(id, title) { let hist = store.getHistory().filter(h =>h.id !== id); hist.unshift({ id, title: title || id, at: Date.now() }); store.saveHistory(hist); renderHistory(); } function filterSort(list, searchVal, sortMode) { let arr = list.filter(x =>!searchVal || (x.title || '').toLowerCase().includes(searchVal)); if (sortMode === 'alpha') arr = arr.slice().sort((a, b) =>(a.title || '').localeCompare(b.title || '', 'ja')); return arr; } function buildTile(item, onDelete) { const card = document.createElement('div'); card.className = 'hcard'; card.innerHTML = `<img class="shimmer thumb-loading" src="https://i.ytimg.com/vi/${item.id}/mqdefault.jpg" onload="this.classList.remove('thumb-loading','shimmer')" onerror="this.style.display='none'"><div class="htitle">${item.title}</div><div class="hcard-time">${timeAgo(item.at)}</div><div class="hdel" title="削除" aria-label="削除">✕</div>`; card.querySelector('.hdel').onclick = (e) =>{ e.stopPropagation(); onDelete(); }; card.onclick = () =>{ document.getElementById("urlInput").value = item.id; loadVideo(false); }; return card; } function renderHistory() { const all = store.getHistory(); document.getElementById('histCount').textContent = all.length ? `(${all.length}件)` : ''; const searchVal = (document.getElementById('historySearch').value || '').toLowerCase(); const hist = filterSort(all, searchVal, histSortMode); const scroll = document.getElementById("historyScroll"); scroll.innerHTML = ''; const emptyEl = document.getElementById("historyEmpty"); emptyEl.style.display = hist.length ? 'none' : 'block'; emptyEl.textContent = (hist.length === 0 && searchVal) ? '一致する履歴が見つかりません。' : '🎞️ 再生した動画はここにタイルとして保存されます。'; hist.forEach(h =>{ const card = buildTile(h, () =>{ store.saveHistory(store.getHistory().filter(x =>x.id !== h.id)); renderHistory(); toast('履歴から削除しました'); }); scroll.appendChild(card); }); } // --- お気に入り機能の実装 --- function toggleFavorite() { if (!currentLoadedVideoId) return; let favs = store.getFavorites(); const isExist = favs.some(f =>f.id === currentLoadedVideoId); if (isExist) { favs = favs.filter(f =>f.id !== currentLoadedVideoId); toast('お気に入りから外しました'); } else { favs.unshift({ id: currentLoadedVideoId, title: currentLoadedVideoTitle, at: Date.now() }); toast('お気に入りに追加しました', 'success'); } store.saveFavorites(favs); renderFavorites(); updateFavoriteButtonUI(); } function updateFavoriteButtonUI() { const btn = document.getElementById("favoriteToggleBtn"); if (!currentLoadedVideoId) return; const favs = store.getFavorites(); const isExist = favs.some(f =>f.id === currentLoadedVideoId); if (isExist) { btn.innerText = "⭐ お気に入り解除"; btn.classList.remove("btn-ghost"); btn.classList.add("btn-primary"); } else { btn.innerText = "⭐ お気に入りに追加"; btn.classList.remove("btn-primary"); btn.classList.add("btn-ghost"); } } function renderFavorites() { const all = store.getFavorites(); document.getElementById('favCount').textContent = all.length ? `(${all.length}件)` : ''; const searchVal = (document.getElementById('favSearch').value || '').toLowerCase(); const favs = filterSort(all, searchVal, favSortMode); const scroll = document.getElementById("favoritesScroll"); scroll.innerHTML = ''; const emptyEl = document.getElementById("favoritesEmpty"); emptyEl.style.display = favs.length ? 'none' : 'block'; emptyEl.textContent = (favs.length === 0 && searchVal) ? '一致するお気に入りが見つかりません。' : '🍿 お気に入りに登録された動画はここに保存されます。'; favs.forEach(f =>{ const card = buildTile(f, () =>{ store.saveFavorites(store.getFavorites().filter(x =>x.id !== f.id)); renderFavorites(); updateFavoriteButtonUI(); toast('お気に入りから削除しました'); }); scroll.appendChild(card); }); } function surprisePick() { const pool = [...store.getFavorites(), ...store.getHistory()]; if (pool.length === 0) { toast('まだ再生履歴がありません', 'error'); return; } const pick = pool[Math.floor(Math.random() * pool.length)]; document.getElementById('urlInput').value = pick.id; loadVideo(false); toast(`🎲「${pick.title}」を再生します`, 'success'); } // --- テーマ切り替え機能の実装 --- function initTheme() { const savedTheme = store.getTheme(); const btn = document.getElementById("themeToggleBtn"); if (savedTheme === 'light') { document.body.classList.add('light-mode'); btn.innerText = "☀️ Light Mode"; } else { document.body.classList.remove('light-mode'); btn.innerText = "🌙 Dark Mode"; } } function toggleTheme() { const btn = document.getElementById("themeToggleBtn"); if (document.body.classList.contains('light-mode')) { document.body.classList.remove('light-mode'); btn.innerText = "🌙 Dark Mode"; store.saveTheme('dark'); } else { document.body.classList.add('light-mode'); btn.innerText = "☀️ Light Mode"; store.saveTheme('light'); } } // --- フルスクリーン / 共有 / 貼り付け --- function toggleFullscreen() { const stage = document.getElementById('stageEl'); if (!document.fullscreenElement) { if (stage.requestFullscreen) { stage.requestFullscreen().catch(() =>toast('フルスクリーンに対応していません', 'error')); } else { toast('フルスクリーンに対応していません', 'error'); } } else { document.exitFullscreen && document.exitFullscreen(); } } async function copyShareLink() { if (!currentLoadedVideoId) { toast('再生中の動画がありません', 'error'); return; } const url = `${location.origin}${location.pathname}?v=${currentLoadedVideoId}`; try { await navigator.clipboard.writeText(url); toast('リンクをコピーしました', 'success'); } catch(e) { toast('コピーに失敗しました', 'error'); } } async function pasteFromClipboard() { try { const text = await navigator.clipboard.readText(); if (text) { document.getElementById('urlInput').value = text.trim(); toast('貼り付けました', 'success'); } } catch(e) { toast('クリップボードを読み取れませんでした', 'error'); } } function initFromUrlParam() { const params = new URLSearchParams(location.search); const v = params.get('v'); if (v) { document.getElementById('urlInput').value = v; loadVideo(false); } } // --- コメント機能 --- function sanitizeHTML(html) { const div = document.createElement('div'); div.innerHTML = html; ['script', 'iframe', 'object', 'style'].forEach(tag =>{ div.querySelectorAll(tag).forEach(el =>el.remove()); }); return div.innerHTML; } function skeletonComments(n) { let html = ''; for (let i = 0; i< n; i++) { html += `<div class="comment-item"><div class="comment-avatar"><div class="skel-circle shimmer"></div></div><div class="comment-content"><div class="skel-line shimmer" style="width:35%"></div><div class="skel-line shimmer" style="width:92%"></div><div class="skel-line shimmer" style="width:70%"></div></div></div>`; } return html; } async function fetchComments(videoId) { const container = document.getElementById("commentsContainer"); container.innerHTML = skeletonComments(3); document.getElementById("commentCountBadge").innerText = ''; if (!cachedApiUrls) { try { const r = await fetch("https://raw.githubusercontent.com/Minotaur-ZAOU/test/refs/heads/main/min-tube-api.json"); cachedApiUrls = r.ok ? await r.json() : fallbackApiUrls; } catch (err) { cachedApiUrls = fallbackApiUrls; } } let data = null; for (const baseUrl of cachedApiUrls) { try { const res = await fetch(`${baseUrl.replace(/\/$/, '')}/api/comments/${videoId}`); if (res.ok) { data = await res.json(); break; } } catch (err) {} } if (!data || !data.comments || data.comments.length === 0) { container.innerHTML = '<div id="commentsEmpty">コメントが見つかりませんでした。</div>'; return; } document.getElementById("commentCountBadge").innerText = `${data.commentCount || data.comments.length}件`; let html = ''; data.comments.forEach(c =>{ const iconUrl = c.authorThumbnails?.[0]?.url || ''; let badges = ''; if (c.isPinned) badges += `<span class="badge" style="background:var(--muted); color:#fff;">📌 固定</span>`; if (c.authorIsChannelOwner) badges += `<span class="badge">👑 配信者</span>`; let heartHtml = c.creatorHeart ? `<div class="creator-heart"><img src="${c.creatorHeart.creatorThumbnail || iconUrl}">❤️</div>` : ''; const safeHtml = sanitizeHTML(c.contentHtml).replace(/<a /g, '<a target="_blank" rel="noopener" '); html += `<div class="comment-item"><div class="comment-avatar"><img src="${iconUrl}" onerror="this.style.display='none'"></div><div class="comment-content"><div class="comment-header"><span class="author-name">${c.author}</span>${badges}<span class="published-date">${c.publishedText}</span></div><div class="comment-text">${safeHtml}</div><div class="comment-footer"><span>👍 ${c.likeCount}</span>${c.replies?.replyCount >0 ? `<span>💬 ${c.replies.replyCount}</span>` : ''} ${heartHtml}</div></div></div>`; }); container.innerHTML = html; } // --- イベントリスナー --- document.getElementById("btnPlay").onclick = () =>loadVideo(false); document.getElementById("urlInput").addEventListener("keydown", (e) =>{ if (e.key === "Enter") loadVideo(false); }); document.getElementById("pasteBtn").onclick = pasteFromClipboard; document.getElementById("fullscreenBtn").onclick = toggleFullscreen; document.getElementById("copyLinkBtn").onclick = copyShareLink; document.getElementById("favoriteToggleBtn").onclick = toggleFavorite; document.getElementById("themeToggleBtn").onclick = toggleTheme; document.getElementById("favSurpriseBtn").onclick = surprisePick; document.getElementById("favSearch").addEventListener("input", renderFavorites); document.getElementById("historySearch").addEventListener("input", renderHistory); document.getElementById("favSortBtn").onclick = () =>{ favSortMode = favSortMode === 'recent' ? 'alpha' : 'recent'; document.getElementById("favSortBtn").innerHTML = favSortMode === 'recent' ? '🕒 最新順' : '🔤 名前順'; renderFavorites(); }; document.getElementById("histSortBtn").onclick = () =>{ histSortMode = histSortMode === 'recent' ? 'alpha' : 'recent'; document.getElementById("histSortBtn").innerHTML = histSortMode === 'recent' ? '🕒 最新順' : '🔤 名前順'; renderHistory(); }; document.getElementById("clearHistoryBtn").onclick = async () =>{ if (await confirmDialog('ライブラリの履歴をすべて削除しますか？')) { store.saveHistory([]); renderHistory(); toast('履歴を削除しました', 'success'); } }; document.getElementById("clearFavoritesBtn").onclick = async () =>{ if (await confirmDialog('お気に入りをすべて削除しますか？')) { store.saveFavorites([]); renderFavorites(); updateFavoriteButtonUI(); toast('お気に入りを削除しました', 'success'); } }; document.addEventListener('keydown', (e) =>{ if (e.key === '/' && !['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) { e.preventDefault(); document.getElementById('urlInput').focus(); } }); // 初期化 initTheme(); generateBulbs('marqueeTop', 26); generateBulbs('marqueeBottom', 26); renderHistory(); renderFavorites(); initFromUrlParam();</script></body></html>
